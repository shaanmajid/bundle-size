name: Check Package Version

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  check-package-version:
    name: Check package version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must be stable SemVer: $package_version"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"

            if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Skipping non-SemVer tag $GITHUB_REF_NAME"
              exit 0
            fi

            if [ "$tag_version" != "$package_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $package_version"
              exit 1
            fi
          fi

          echo "package.json version $package_version is valid"
